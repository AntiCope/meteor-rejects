plugins {
	id 'java'
	id 'net.fabricmc.fabric-loom' version '1.17.0-alpha.14'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
	mavenLocal()
	mavenCentral()
	maven { url "https://maven.meteordev.org/releases"}
	maven { url "https://maven.meteordev.org/snapshots" }
	maven { url "https://maven.seedfinding.com/" }
	maven { url "https://maven-snapshots.seedfinding.com/" }
	maven { url 'https://jitpack.io' }
	maven { url 'https://maven.duti.dev/releases' }
}

loom {
	accessWidenerPath = file("src/main/resources/meteor-rejects.accesswidener")
}

configurations {
	// configuration that holds jars to include in the jar
	extraLibs
}

dependencies {
	// This will make it work on most platforms. It automatically chooses the right dependencies at runtime.
	extraLibs('dev.duti.acheong:cubiomes:1.22.5') { transitive = false }
	extraLibs('dev.duti.acheong:cubiomes:1.22.5:linux64') { transitive = false }
	extraLibs('dev.duti.acheong:cubiomes:1.22.5:osx') { transitive = false }
	extraLibs('dev.duti.acheong:cubiomes:1.22.5:windows64') { transitive = false }
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	compileOnly "net.fabricmc.fabric-api:fabric-resource-loader-v1:${project.fabric_resource_loader_version}"

	implementation("meteordevelopment:meteor-client:${project.minecraft_version}-SNAPSHOT")
	compileOnly "meteordevelopment:baritone:${project.baritone_version}-SNAPSHOT"

	// seed .locate and ore sim
	extraLibs('com.seedfinding:mc_math:1.171.0') { transitive = false }
	extraLibs('com.seedfinding:mc_seed:1.171.2') { transitive = false }
	extraLibs('com.seedfinding:mc_core:1.210.0') { transitive = false }
	extraLibs('com.seedfinding:mc_noise:1.171.1') { transitive = false }
	extraLibs('com.seedfinding:mc_biome:1.171.1') { transitive = false }
	extraLibs('com.seedfinding:mc_terrain:1.171.1') { transitive = false }
	extraLibs('com.seedfinding:mc_feature:1.171.11') { transitive = false }

	// seedcracker api
	implementation (include('com.github.19MisterX98.SeedcrackerX:seedcrackerx-api:2.15.0')) {transitive = false}
//	implementation (include('com.github.19MisterX98.SeedcrackerX:seedcrackerx-api:master-SNAPSHOT')) {transitive = false}

	// Exploit Preventer (optional)
	compileOnly("com.nikoverflow:exploit-preventer-api:1.0.0")

	configurations.implementation.extendsFrom(configurations.extraLibs)
}

processResources {
	inputs.property "version", project.version


	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"mc_version": project.minecraft_version,
				"gh_hash": (System.getenv("GITHUB_SHA") ?: "")
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName}" }
	}
	from {
		configurations.extraLibs.collect { it.isDirectory() ? it : zipTree(it) }
	}
}
tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// The Minecraft launcher currently installs Java 8 for users, so your mod probably wants to target Java 8 too
	// JDK 9 introduced a new way of specifying this that will make sure no newer classes or methods are used.
	// We'll use that if it's available, but otherwise we'll use the older option.
	def targetVersion = 25
	if (JavaVersion.current().isJava9Compatible()) {
		 it.options.release = targetVersion
	}
}
